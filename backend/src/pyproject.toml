[project]
name = "backend"
version = "0.1.0"
description = "backend for snMCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.64.0",
    "ipython>=9.12.0",
    "langchain>=1.2.13",
    "langchain-core>=1.2.20",
    "langchain-google-genai>=4.2.1",
    "langchain-openai>=1.1.11",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.1.3",
    "markitdown[all]>=0.1.0",
    "mcp>=1.28.1",
    "onnxruntime>=1.23.2",
    "openai>=2.30.0",
    "python-dotenv>=1.2.2",
    "rapidocr>=3.4.2",
    "ruamel-yaml>=0.18.16",
    "weaviate-client>=4.18.1",
]

[project.scripts]
bggo = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]
